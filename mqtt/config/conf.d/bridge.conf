# MQTT bridge to EC2 cloud broker
connection sb-ec2-bridge
address 98.83.4.87:1883

remote_username bridge
remote_password bridge123
remote_clientid sb-bridge-gw-ubuntu-01

# Gateway → Cloud
topic devices/+/reported out 1 sb/v1/hust/lab01/gw-ubuntu-01/ sb/v1/hust/lab01/gw-ubuntu-01/
topic devices/+/event out 1 sb/v1/hust/lab01/gw-ubuntu-01/ sb/v1/hust/lab01/gw-ubuntu-01/
topic commands/+/reply out 1 sb/v1/hust/lab01/gw-ubuntu-01/ sb/v1/hust/lab01/gw-ubuntu-01/
topic gateway/online out 1 sb/v1/hust/lab01/gw-ubuntu-01/ sb/v1/hust/lab01/gw-ubuntu-01/

# Cloud → Gateway
topic devices/+/desired in 1 sb/v1/hust/lab01/gw-ubuntu-01/ sb/v1/hust/lab01/gw-ubuntu-01/
topic commands/+/request in 1 sb/v1/hust/lab01/gw-ubuntu-01/ sb/v1/hust/lab01/gw-ubuntu-01/

restart_timeout 30 120
notifications false
