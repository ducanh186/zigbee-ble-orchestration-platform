# MQTT bridge template: local Mosquitto -> remote production broker.
# Copy this file into config/conf.d/bridge.conf and replace placeholders before use.
# Do not commit real remote endpoints or bridge passwords.

# connection sb-remote-bridge
# address <REMOTE_MQTT_HOST>:8883

# remote_username bridge
# remote_password <REMOTE_BRIDGE_PASSWORD>

# bridge_protocol_version mqttv311
# cleansession false
# try_private true

# topic sb/v1/# both 1

# restart_timeout 5 30
# keepalive_interval 60

# local_clientid <LOCAL_BRIDGE_CLIENT_ID>
# remote_clientid <REMOTE_BRIDGE_CLIENT_ID>

# notifications true
# notification_topic sb/v1/<TENANT_ID>/<SITE_ID>/<GATEWAY_ID>/bridge/state
