# MQTT Bridge: Local Mosquitto → EC2 Mosquitto
# This file is ONLY loaded on the local gateway machine (via conf.d/).
# On EC2, conf.d/ is empty — this file is NOT deployed there.

connection sb-ec2-bridge
address 52.199.233.62:1883

# Credentials for the 'bridge' user on EC2 broker
remote_username bridge
remote_password bridge123

# Bridge ALL sb/v1 topics bidirectionally at QoS 1
topic sb/v1/# both 1

# Protocol and session
bridge_protocol_version mqttv311
cleansession false
try_private true

# Reconnect: start at 5s, max backoff 30s
restart_timeout 5 30
keepalive_interval 60

# Client IDs (must be unique per gateway)
local_clientid sb-bridge-local
remote_clientid sb-bridge-gw-ubuntu-01

# Bridge status notification
notifications true
notification_topic sb/v1/hust/lab01/gw-ubuntu-01/bridge/state
