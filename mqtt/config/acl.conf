# ACLs for the sb/v1/{tenant}/{site}/{gateway}/... namespace
#
# Device topics use: devices/{device_type}/{device_id}/...
# Group topics use:  groups/{group_id}/...
# Scene topics use:  scenes/{scene_id}/...

user gateway
topic readwrite sb/v1/+/+/+/#

user client
# Gateway status
topic read sb/v1/+/+/+/gateway/online
topic read sb/v1/+/+/+/gateway/health
topic read sb/v1/+/+/+/gateway/log
# Device uplink (device_type / device_id)
topic read sb/v1/+/+/+/devices/+/+/registry
topic read sb/v1/+/+/+/devices/+/+/reported
topic read sb/v1/+/+/+/devices/+/+/telemetry
topic read sb/v1/+/+/+/devices/+/+/event
# Commands
topic read sb/v1/+/+/+/commands/+/reply
# OTA
topic read sb/v1/+/+/+/ota/devices/+/progress
topic read sb/v1/+/+/+/ota/devices/+/event
topic read sb/v1/+/+/+/ota/campaigns/+/manifest
# Device downlink
topic write sb/v1/+/+/+/devices/+/+/desired
# Commands
topic write sb/v1/+/+/+/commands/+/request
# OTA
topic write sb/v1/+/+/+/ota/campaigns/+/manifest
topic write sb/v1/+/+/+/ota/devices/+/desired
# Groups
topic read sb/v1/+/+/+/groups/+/reported
topic write sb/v1/+/+/+/groups/+/desired
# Scenes
topic read sb/v1/+/+/+/scenes/+/event
topic write sb/v1/+/+/+/scenes/+/desired

user monitor
topic read sb/v1/+/+/+/#
topic read $SYS/#

user bridge
topic readwrite sb/v1/+/+/+/#
