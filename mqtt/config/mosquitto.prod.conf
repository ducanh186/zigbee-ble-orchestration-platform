# Production Mosquitto config for the sb/v1 gateway namespace.
# This profile is intended for the secure production compose path only.

per_listener_settings true

listener 8883 0.0.0.0
protocol mqtt

allow_anonymous false
password_file /mosquitto/passwords/passwd
acl_file /mosquitto/config/acl.prod.conf

cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
require_certificate true
use_identity_as_username false
tls_version tlsv1.2

persistence true
persistence_location /mosquitto/data/
autosave_interval 300

max_packet_size 65536
max_connections 100
max_inflight_messages 20
max_queued_messages 1000

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_timestamp true
log_timestamp_format %Y-%m-%d %H:%M:%S
