<!doctype html>
<html data-theme="dark"><head><meta charset="utf-8"><title>Dark palette</title>
<link rel="stylesheet" href="_card.css">
</head><body>
<div class="col">

    <div class="swatch" style="background:#161A21;color:#F9FAFB"><span class="name">Background</span><span class="hex">#161A21</span></div>
    <div class="swatch" style="background:#1F232C;color:#F9FAFB"><span class="name">Surface</span><span class="hex">#1F232C</span></div>

    <div class="swatch" style="background:#8AAEFF;color:#0F1115"><span class="name">Primary</span><span class="hex">#8AAEFF</span></div>
