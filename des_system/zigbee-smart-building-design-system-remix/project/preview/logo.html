<!doctype html>
<html data-theme="light"><head><meta charset="utf-8"><title>Logo</title>
<link rel="stylesheet" href="_card.css">
<style>
  body { padding: 22px; display:flex; gap:16px; flex-direction:column; }
  .lockup { background: var(--surface); border:1px solid var(--border); border-radius:20px; padding:22px; display:flex; align-items:center; gap:18px; }
  .lockup.dark { background:#0F1115; border-color:#2D3340; color:#F9FAFB; }
  .lockup.grey { background:#F6F7F9; border-color:#D1D5DB; color:#1F2937; }
  .lockup .meta { font:500 12px var(--font-mono); color: var(--text-secondary); margin-left:auto; }
  .lockup.dark .meta { color:#A1A1AA; }
</style>
</head><body>
<div class="lockup"><img src="../assets/logo.svg" width="180" height="50"><span class="meta">light · placeholder</span></div>
<div class="lockup dark"><img src="../assets/logo.svg" width="180" height="50" style="filter:invert(1)"><span class="meta">dark</span></div>
</body></html>
