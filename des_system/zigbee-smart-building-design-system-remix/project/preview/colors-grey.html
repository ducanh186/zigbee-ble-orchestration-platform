<!doctype html>
<html data-theme="grey"><head><meta charset="utf-8"><title>Grey palette</title>
<link rel="stylesheet" href="_card.css">
</head><body>
<div class="col">
  <div class="row">
    <div class="swatch" style="background:#EAE6DF;color:#1A1814"><span class="name">Background</span><span class="hex">#EAE6DF</span></div>
    <div class="swatch" style="background:#F3F0EA;color:#1A1814"><span class="name">Surface</span><span class="hex">#F3F0EA</span></div>
    <div class="swatch" style="background:#FAF8F4;color:#1A1814;border:1px solid #D2CCC0"><span class="name">Surface elevated</span><span class="hex">#FAF8F4</span></div>
  </div>
  <div class="row">
    <div class="swatch" style="background:#5C5448;color:#fff"><span class="name">Primary</span><span class="hex">#5C5448</span></div>
    <div class="swatch" style="background:#1A1814;color:#fff"><span class="name">Text primary</span><span class="hex">#1A1814</span></div>
    <div class="swatch" style="background:#D2CCC0;color:#1A1814"><span class="name">Border</span><span class="hex">#D2CCC0</span></div>
  </div>
</div>
</body></html>
