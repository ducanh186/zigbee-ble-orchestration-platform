<!doctype html>
<html data-theme="light">
<head>
  <meta charset="utf-8">
  <title>Zigbee SB · Mobile Preview</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="colors_and_type.css">
  <style>
    body {
      margin: 0; min-height: 100vh; padding: 32px 16px;
      font-family: 'Inter', sans-serif;
      background:
        radial-gradient(circle at 20% 0%, #e8eef9 0%, transparent 40%),
        radial-gradient(circle at 80% 100%, #efe9f8 0%, transparent 40%),
        #f1f3f7;
      display: flex; flex-direction: column; align-items: center; gap: 22px;
      transition: background 200ms;
    }
    body[data-bg="dark"] {
      background:
        radial-gradient(circle at 20% 0%, #1a2030 0%, transparent 45%),
        radial-gradient(circle at 80% 100%, #261b30 0%, transparent 45%),
        #0a0c10;
    }
    body[data-bg="grey"] {
      background:
        radial-gradient(circle at 20% 0%, #d6d9de 0%, transparent 40%),
        radial-gradient(circle at 80% 100%, #d6d9de 0%, transparent 40%),
        #c8ccd2;
    }
    .toolbar {
      display: flex; gap: 6px; align-items: center;
      background: rgba(255,255,255,0.85); backdrop-filter: blur(12px);
      border: 1px solid rgba(0,0,0,0.06);
      padding: 6px; border-radius: 999px;
      box-shadow: 0 8px 24px rgb(0 0 0 / 0.06);
    }
    body[data-bg="dark"] .toolbar {
      background: rgba(20,24,32,0.8);
      border-color: rgba(255,255,255,0.1);
      color: #e5e7eb;
    }
    body[data-bg="grey"] .toolbar {
      background: rgba(255,255,255,0.9);
    }
    .toolbar .lbl {
      font: 600 11px 'Inter', sans-serif; color: #9ca3af;
      padding: 0 10px; letter-spacing: 0.06em; text-transform: uppercase;
    }
    .toolbar button {
      border: none; background: transparent; padding: 8px 16px;
      border-radius: 999px; font: 600 13px 'Inter', sans-serif;
      cursor: pointer; color: #6b7280;
    }
    .toolbar button.active { background: #111827; color: #fff; }
    body[data-bg="dark"] .toolbar button { color: #d1d5db; }
    body[data-bg="dark"] .toolbar button.active { background: #f9fafb; color: #0f1115; }
    .caption {
      font: 500 12px 'JetBrains Mono', monospace;
      color: #6b7280; letter-spacing: 0.04em;
    }
    body[data-bg="dark"] .caption { color: #9ca3af; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>

  <div class="toolbar">
    <span class="lbl">Theme</span>
    <button data-t="light" class="active">Light</button>
    <button data-t="dark">Dark</button>
    <button data-t="grey">Grey</button>
  </div>

  <div id="root"></div>

  <div class="caption">tap Devices · open a Light · then try ON/OFF</div>

  <script type="text/babel" src="ui_kits/mobile_app/Phone.jsx"></script>
  <script type="text/babel" src="ui_kits/mobile_app/Components.jsx"></script>
  <script type="text/babel" src="ui_kits/mobile_app/Mock.jsx"></script>
  <script type="text/babel" src="ui_kits/mobile_app/HomeScreen.jsx"></script>
  <script type="text/babel" src="ui_kits/mobile_app/DevicesScreen.jsx"></script>
  <script type="text/babel" src="ui_kits/mobile_app/LightDetailScreen.jsx"></script>
  <script type="text/babel" src="ui_kits/mobile_app/LogsScreen.jsx"></script>
  <script type="text/babel" src="ui_kits/mobile_app/SettingsScreen.jsx"></script>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [theme, setTheme] = useState('light');
      const [tab, setTab] = useState('home');
      const [route, setRoute] = useState(null);

      // sync body bg + toolbar active state
      useEffect(() => {
        document.body.dataset.bg = theme;
        document.querySelectorAll('.toolbar button').forEach(b => {
          b.classList.toggle('active', b.dataset.t === theme);
        });
      }, [theme]);

      // toolbar wiring
      useEffect(() => {
        const handler = (e) => {
          const t = e.target.dataset.t;
          if (t) setTheme(t);
        };
        document.querySelector('.toolbar').addEventListener('click', handler);
        return () => document.querySelector('.toolbar').removeEventListener('click', handler);
      }, []);

      // refresh icons on every render
      useEffect(() => { lucide.createIcons(); });

      const onOpenLight = (deviceId) => setRoute({ name: 'light-detail', deviceId });
      const back = () => setRoute(null);

      let screen;
      if (route?.name === 'light-detail') {
        screen = <LightDetailScreen deviceId={route.deviceId} onBack={back} />;
      } else if (tab === 'home') {
        screen = <HomeScreen onOpenLight={onOpenLight} />;
      } else if (tab === 'devices') {
        screen = <DevicesScreen onOpenLight={onOpenLight} />;
      } else if (tab === 'logs') {
        screen = <LogsScreen />;
      } else {
        screen = <SettingsScreen theme={theme} onTheme={setTheme} />;
      }

      return (
        <Phone theme={theme} label="Mobile preview">
          {screen}
          {!route && <BottomNav active={tab} onChange={t => { setTab(t); setRoute(null); }} />}
        </Phone>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
