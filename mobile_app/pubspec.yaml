name: zigbee_smart_building
description: Operator mobile app for Zigbee Smart Building LIGHT control.
publish_to: 'none'
version: 1.2.1+1201

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  intl: any
  provider: ^6.1.5+1
  google_fonts: ^6.2.1
  shared_preferences: ^2.5.3
  mobile_scanner: ^7.2.0
  flutter_secure_storage: ^10.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
