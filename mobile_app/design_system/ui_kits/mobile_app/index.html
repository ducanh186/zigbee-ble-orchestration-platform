<!doctype html>
<html data-theme="light">
<head>
  <meta charset="utf-8">
  <title>Zigbee SB · Mobile UI Kit</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="../../colors_and_type.css">
  <style>
    body {
      margin: 0; min-height: 100vh;
      background:
        radial-gradient(circle at 20% 0%, #e8eef9 0%, transparent 40%),
        radial-gradient(circle at 80% 100%, #efe9f8 0%, transparent 40%),
        #f1f3f7;
      font-family: 'Inter', sans-serif;
      padding: 32px 16px;
      display: flex; flex-direction: column; align-items: center; gap: 18px;
    }
    .toolbar {
      display: flex; gap: 8px; align-items: center;
      background: rgba(255,255,255,0.85); backdrop-filter: blur(12px);
      border: 1px solid rgba(0,0,0,0.06);
      padding: 6px; border-radius: 999px;
      box-shadow: 0 8px 24px rgb(0 0 0 / 0.06);
    }
    .toolbar button {
      border: none; background: transparent; padding: 8px 16px;
      border-radius: 999px; font: 600 13px 'Inter', sans-serif;
      cursor: pointer; color: #4b5563;
    }
    .toolbar button.active { background: #111827; color: #fff; }
    .stage {
      display: flex; gap: 24px; flex-wrap: wrap; justify-content: center;
      width: 100%; max-width: 1280px;
    }
    .lbl {
      text-align: center; font: 500 12px 'JetBrains Mono', monospace;
      color: #6b7280; margin-top: 6px; letter-spacing: 0.04em;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div class="toolbar" id="theme-toolbar">
    <span style="font:600 12px 'Inter',sans-serif;color:#9ca3af;padding:0 8px;letter-spacing:0.06em;text-transform:uppercase">Theme</span>
    <button data-t="light" class="active">Light</button>
    <button data-t="dark">Dark</button>
    <button data-t="grey">Grey</button>
  </div>

  <div class="stage" id="root"></div>

  <script type="text/babel" src="Phone.jsx"></script>
  <script type="text/babel" src="Components.jsx"></script>
  <script type="text/babel" src="Mock.jsx"></script>
  <script type="text/babel" src="HomeScreen.jsx"></script>
  <script type="text/babel" src="DevicesScreen.jsx"></script>
  <script type="text/babel" src="LightDetailScreen.jsx"></script>
  <script type="text/babel" src="LogsScreen.jsx"></script>
  <script type="text/babel" src="SettingsScreen.jsx"></script>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function PhoneApp({ initialTab = 'home', theme, label }) {
      const [tab, setTab] = useState(initialTab);
      const [route, setRoute] = useState(null); // { name: 'light-detail', deviceId }
      const [innerTheme, setInnerTheme] = useState(theme);
      useEffect(() => setInnerTheme(theme), [theme]);

      const onOpenLight = (deviceId) => setRoute({ name: 'light-detail', deviceId });
      const back = () => setRoute(null);

      let screen;
      if (route?.name === 'light-detail') {
        screen = <LightDetailScreen deviceId={route.deviceId} onBack={back} />;
      } else if (tab === 'home') {
        screen = <HomeScreen onOpenLight={onOpenLight} />;
      } else if (tab === 'devices') {
        screen = <DevicesScreen onOpenLight={onOpenLight} />;
      } else if (tab === 'logs') {
        screen = <LogsScreen />;
      } else {
        screen = <SettingsScreen theme={innerTheme} onTheme={setInnerTheme} />;
      }

      // refresh icons after each render
      useEffect(() => { lucide.createIcons(); });

      return (
        <div>
          <Phone theme={innerTheme} label={label}>
            {screen}
            {!route && <BottomNav active={tab} onChange={setTab} />}
          </Phone>
          <div className="lbl">{label}</div>
        </div>
      );
    }

    function App() {
      const [theme, setTheme] = useState('light');

      useEffect(() => {
        const tb = document.getElementById('theme-toolbar');
        const click = (e) => {
          const t = e.target.dataset.t;
          if (!t) return;
          tb.querySelectorAll('button').forEach(b => b.classList.toggle('active', b.dataset.t === t));
          setTheme(t);
        };
        tb.addEventListener('click', click);
        return () => tb.removeEventListener('click', click);
      }, []);

      return (
        <>
          <PhoneApp initialTab="home"     theme={theme} label="01 Home" />
          <PhoneApp initialTab="devices"  theme={theme} label="02 Devices" />
          <PhoneApp initialTab="devices"  theme={theme} label="03 Light detail" />
          <PhoneApp initialTab="logs"     theme={theme} label="04 Logs" />
          <PhoneApp initialTab="settings" theme={theme} label="05 Settings" />
        </>
      );
    }

    // Phone-3 wants the light-detail route open on mount; small wrapper component.
    function PhoneAppDetail({ theme, label }) {
      // We re-create PhoneApp logic here to inject an initial route.
      const [innerTheme, setInnerTheme] = React.useState(theme);
      React.useEffect(() => setInnerTheme(theme), [theme]);
      React.useEffect(() => { lucide.createIcons(); });
      return (
        <div>
          <Phone theme={innerTheme} label={label}>
            <LightDetailScreen deviceId="light-01" onBack={() => {}} />
          </Phone>
          <div className="lbl">{label}</div>
        </div>
      );
    }

    // Replace App with a version where slot 3 uses PhoneAppDetail.
    function AppFixed() {
      const [theme, setTheme] = useState('light');
      useEffect(() => {
        const tb = document.getElementById('theme-toolbar');
        const click = (e) => {
          const t = e.target.dataset.t;
          if (!t) return;
          tb.querySelectorAll('button').forEach(b => b.classList.toggle('active', b.dataset.t === t));
          setTheme(t);
        };
        tb.addEventListener('click', click);
        return () => tb.removeEventListener('click', click);
      }, []);
      return (
        <>
          <PhoneApp        initialTab="home"     theme={theme} label="01 Home" />
          <PhoneApp        initialTab="devices"  theme={theme} label="02 Devices" />
          <PhoneAppDetail                        theme={theme} label="03 Light detail" />
          <PhoneApp        initialTab="logs"     theme={theme} label="04 Logs" />
          <PhoneApp        initialTab="settings" theme={theme} label="05 Settings" />
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<AppFixed />);
  </script>
</body>
</html>
