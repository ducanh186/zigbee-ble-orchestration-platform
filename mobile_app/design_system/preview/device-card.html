<!doctype html>
<html data-theme="light"><head><meta charset="utf-8"><title>Device card</title>
<link rel="stylesheet" href="_card.css">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  body { padding: 22px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 16px; box-shadow: var(--elev-1); display:flex; align-items:center; gap:14px; }
  .icon { width: 44px; height: 44px; border-radius: 12px; background: var(--primary-tint); color: var(--primary); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .meta { flex: 1; min-width: 0; }
  .meta .name { font: 600 16px var(--font-sans); }
  .meta .sub { font: 400 13px var(--font-mono); color: var(--text-secondary); margin-top:2px; }
  .badge { padding: 4px 10px; border-radius:999px; font:500 12px var(--font-mono); background:var(--success-tint); color:var(--success); }
  .toggle { width:52px; height:30px; border-radius:999px; background:var(--success); position:relative; flex-shrink:0; }
  .toggle::after { content:""; position:absolute; top:3px; right:3px; width:24px; height:24px; border-radius:999px; background:#fff; }
</style>
</head><body>
<div class="col" style="gap:10px">
  <div class="card">
    <div class="icon"><i data-lucide="lightbulb"></i></div>
    <div class="meta"><div class="name">Lab Light 01</div><div class="sub">light-01 · Lab 01</div></div>
    <span class="badge">ON</span>
    <div class="toggle"></div>
  </div>
  <div class="card">
    <div class="icon" style="background:rgb(107 114 128/.14);color:var(--text-secondary)"><i data-lucide="lightbulb"></i></div>
    <div class="meta"><div class="name">Hallway Light</div><div class="sub">light-02 · Lobby</div></div>
    <span class="badge" style="background:rgb(107 114 128/.14);color:var(--text-secondary)">OFF</span>
    <div class="toggle" style="background:#CBD2DB"></div>
  </div>
  <div class="card" style="opacity:.85">
    <div class="icon" style="background:var(--warning-tint);color:var(--warning)"><i data-lucide="lightbulb"></i></div>
    <div class="meta"><div class="name">Stairwell B</div><div class="sub">light-09 · Floor 2</div></div>
    <span class="badge" style="background:var(--warning-tint);color:var(--warning)">UNREACHABLE</span>
    <div class="toggle" style="background:#CBD2DB;opacity:.5"></div>
  </div>
</div>
<script>lucide.createIcons();</script>
</body></html>
