<!doctype html>
<html data-theme="light"><head><meta charset="utf-8"><title>Type scale</title>
<link rel="stylesheet" href="_card.css">
<style>
  body { padding: 24px; }
  .specimen { display: grid; grid-template-columns: 110px 1fr; gap: 6px 16px; align-items: baseline; }
  .role { color: var(--text-secondary); font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; }
  .meta { color: var(--text-secondary); font-size: 11px; font-family: var(--font-mono); }
</style>
</head><body>
<div class="specimen">
  <div class="role">Display</div>
  <div><span class="t-display">Light unreachable</span><div class="meta">Inter 700 · 28 / 1.2</div></div>
  <div class="role">Title</div>
  <div><span class="t-title">Lab Light 01</span><div class="meta">Inter 600 · 20 / 1.3</div></div>
  <div class="role">Body</div>
  <div><span class="t-body">Last reported 7 seconds ago.</span><div class="meta">Inter 400 · 15 / 1.5</div></div>
  <div class="role">Caption</div>
  <div><span class="t-caption">SOURCE · GATEWAY</span><div class="meta">Inter 500 · 13 / 1.4</div></div>
  <div class="role">Mono</div>
  <div><span class="t-mono">command_id=cmd-01 device=light-01</span><div class="meta">JetBrains Mono 400 · 13 / 1.5</div></div>
</div>
</body></html>
