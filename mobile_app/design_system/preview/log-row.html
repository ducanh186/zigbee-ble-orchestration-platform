<!doctype html>
<html data-theme="light"><head><meta charset="utf-8"><title>Log row</title>
<link rel="stylesheet" href="_card.css">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  body { padding: 18px 22px; }
  .row { display:flex; gap:12px; padding:10px 12px; border-radius:12px; align-items:flex-start; }
  .row + .row { border-top: 1px solid var(--border); border-radius: 0; }
  .ts { font: 500 12px var(--font-mono); color: var(--text-secondary); width: 64px; flex-shrink:0; padding-top:1px; }
  .icon { width:18px; height:18px; flex-shrink:0; padding-top:1px; }
  .body { flex:1; min-width:0; }
  .head { font: 500 13px var(--font-mono); }
  .head .tag { color: var(--text-secondary); }
  .msg { font: 400 13px var(--font-sans); margin-top:2px; }
  .meta { font: 400 12px var(--font-mono); color: var(--text-secondary); margin-top:2px; }
  .sev-info  { color: var(--primary); }
  .sev-warn  { color: var(--warning); }
  .sev-err   { color: var(--error); }
</style>
</head><body>
<div>
  <div class="row">
    <div class="ts">07:16:03</div>
    <div class="icon sev-info"><i data-lucide="circle-check"></i></div>
    <div class="body">
      <div class="head"><span class="tag">LIGHT</span> light-01</div>
      <div class="msg">Command executed: off</div>
      <div class="meta">source=gateway · command_id=cmd-01</div>
    </div>
  </div>
  <div class="row">
    <div class="ts">07:15:41</div>
    <div class="icon sev-warn"><i data-lucide="triangle-alert"></i></div>
    <div class="body">
      <div class="head"><span class="tag">GATEWAY</span> gw-1</div>
      <div class="msg">Command timeout</div>
      <div class="meta">source=cloud · command_id=cmd-00</div>
    </div>
  </div>
  <div class="row">
    <div class="ts">07:15:09</div>
    <div class="icon sev-err"><i data-lucide="circle-x"></i></div>
    <div class="body">
      <div class="head"><span class="tag">LIGHT</span> light-02</div>
      <div class="msg">Command failed: cluster busy</div>
      <div class="meta">source=gateway · command_id=cmd-99</div>
    </div>
  </div>
</div>
<script>lucide.createIcons();</script>
</body></html>
