<!doctype html>
<html data-theme="grey"><head><meta charset="utf-8"><title>Grey palette</title>
<link rel="stylesheet" href="_card.css">
</head><body>
<div class="col">
  <div class="row">
    <div class="swatch" style="background:#E7E9EC;color:#111418"><span class="name">Background</span><span class="hex">#E7E9EC</span></div>
    <div class="swatch" style="background:#F1F2F4;color:#111418"><span class="name">Surface</span><span class="hex">#F1F2F4</span></div>
    <div class="swatch" style="background:#FAFBFC;color:#111418;border:1px solid #C8CCD2"><span class="name">Surface elevated</span><span class="hex">#FAFBFC</span></div>
  </div>
  <div class="row">
    <div class="swatch" style="background:#4B5563;color:#fff"><span class="name">Primary</span><span class="hex">#4B5563</span></div>
    <div class="swatch" style="background:#111418;color:#fff"><span class="name">Text primary</span><span class="hex">#111418</span></div>
    <div class="swatch" style="background:#C8CCD2;color:#111418"><span class="name">Border</span><span class="hex">#C8CCD2</span></div>
  </div>
</div>
</body></html>
