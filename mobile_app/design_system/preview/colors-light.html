<!doctype html>
<html data-theme="light"><head><meta charset="utf-8"><title>Light palette</title>
<link rel="stylesheet" href="_card.css">
</head><body>
<div class="col">
  <div class="row">
    <div class="swatch" style="background:#F7F8FA;color:#111827"><span class="name">Background</span><span class="hex">#F7F8FA</span></div>
    <div class="swatch" style="background:#FFFFFF;color:#111827"><span class="name">Surface</span><span class="hex">#FFFFFF</span></div>
    <div class="swatch" style="background:#E5E7EB;color:#111827"><span class="name">Border</span><span class="hex">#E5E7EB</span></div>
  </div>
  <div class="row">
    <div class="swatch" style="background:#4F7DFF;color:#fff"><span class="name">Primary</span><span class="hex">#4F7DFF</span></div>
    <div class="swatch" style="background:#111827;color:#fff"><span class="name">Text primary</span><span class="hex">#111827</span></div>
    <div class="swatch" style="background:#6B7280;color:#fff"><span class="name">Text secondary</span><span class="hex">#6B7280</span></div>
  </div>
</div>
</body></html>
