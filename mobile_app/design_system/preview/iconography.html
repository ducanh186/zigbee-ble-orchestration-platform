<!doctype html>
<html data-theme="light"><head><meta charset="utf-8"><title>Iconography</title>
<link rel="stylesheet" href="_card.css">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  body { padding: 22px; }
  .grid { display:grid; grid-template-columns: repeat(8, 1fr); gap: 10px; }
  .ico { display:flex; flex-direction:column; align-items:center; gap:6px; padding: 10px 6px; border-radius:12px; background: var(--surface); border:1px solid var(--border); }
  .ico svg { width:22px; height:22px; color: var(--text-primary); }
  .ico .n { font: 500 11px var(--font-mono); color: var(--text-secondary); }
</style>
</head><body>
<div class="grid">
  <div class="ico"><i data-lucide="lightbulb"></i><span class="n">light</span></div>
  <div class="ico"><i data-lucide="radar"></i><span class="n">motion</span></div>
  <div class="ico"><i data-lucide="toggle-left"></i><span class="n">switch</span></div>
  <div class="ico"><i data-lucide="lock"></i><span class="n">lock</span></div>
  <div class="ico"><i data-lucide="router"></i><span class="n">gateway</span></div>
  <div class="ico"><i data-lucide="circle-help"></i><span class="n">unknown</span></div>
  <div class="ico"><i data-lucide="terminal"></i><span class="n">log</span></div>
  <div class="ico"><i data-lucide="triangle-alert"></i><span class="n">error</span></div>
  <div class="ico"><i data-lucide="wifi"></i><span class="n">online</span></div>
  <div class="ico"><i data-lucide="wifi-off"></i><span class="n">offline</span></div>
  <div class="ico"><i data-lucide="refresh-cw"></i><span class="n">refresh</span></div>
  <div class="ico"><i data-lucide="sliders-horizontal"></i><span class="n">filter</span></div>
  <div class="ico"><i data-lucide="search"></i><span class="n">search</span></div>
  <div class="ico"><i data-lucide="house"></i><span class="n">home</span></div>
  <div class="ico"><i data-lucide="settings"></i><span class="n">settings</span></div>
  <div class="ico"><i data-lucide="chevron-right"></i><span class="n">chevron</span></div>
</div>
<script>lucide.createIcons();</script>
</body></html>
