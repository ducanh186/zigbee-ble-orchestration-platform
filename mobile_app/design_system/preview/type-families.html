<!doctype html>
<html data-theme="light"><head><meta charset="utf-8"><title>Type families</title>
<link rel="stylesheet" href="_card.css">
<style>
  body { padding: 24px; }
  .stack { display: flex; flex-direction: column; gap: 14px; }
  .fam { padding: 14px 16px; border: 1px solid var(--border); border-radius: 16px; background: var(--surface); }
  .fam h3 { margin: 0 0 4px; font: 600 13px var(--font-sans); color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.06em; }
  .fam .specimen { font-size: 22px; }
  .fam .meta { font: 400 12px var(--font-mono); color: var(--text-secondary); margin-top: 2px; }
</style>
</head><body>
<div class="stack">
  <div class="fam">
    <h3>Sans · Inter</h3>
    <div class="specimen" style="font-family:var(--font-sans);font-weight:600">The quick brown light turns ON.</div>
    <div class="meta">400 / 500 / 600 / 700 — UI, headings, body</div>
  </div>
  <div class="fam">
    <h3>Mono · JetBrains Mono</h3>
    <div class="specimen" style="font-family:var(--font-mono);font-weight:500">cmd-01 · light-01 · 0xO1l</div>
    <div class="meta">400 / 500 — IDs, payloads, log rows</div>
  </div>
</div>
</body></html>
