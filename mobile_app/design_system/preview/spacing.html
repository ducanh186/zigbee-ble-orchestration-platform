<!doctype html>
<html data-theme="light"><head><meta charset="utf-8"><title>Spacing scale</title>
<link rel="stylesheet" href="_card.css">
<style>
  body { padding: 24px; }
  .row2 { display: flex; align-items: center; gap: 16px; padding: 6px 0; }
  .row2 .name { width: 60px; font: 600 13px var(--font-mono); }
  .row2 .px   { width: 60px; color: var(--text-secondary); font: 500 12px var(--font-mono); }
  .row2 .bar  { height: 12px; background: var(--primary); border-radius: 4px; }
</style>
</head><body>
<div>
  <div class="row2"><span class="name">--s-1</span><span class="px">4 px</span><div class="bar" style="width:4px"></div></div>
  <div class="row2"><span class="name">--s-2</span><span class="px">8 px</span><div class="bar" style="width:8px"></div></div>
  <div class="row2"><span class="name">--s-3</span><span class="px">12 px</span><div class="bar" style="width:12px"></div></div>
  <div class="row2"><span class="name">--s-4</span><span class="px">16 px</span><div class="bar" style="width:16px"></div></div>
  <div class="row2"><span class="name">--s-5</span><span class="px">20 px</span><div class="bar" style="width:20px"></div></div>
  <div class="row2"><span class="name">--s-6</span><span class="px">24 px</span><div class="bar" style="width:24px"></div></div>
  <div class="row2"><span class="name">--s-8</span><span class="px">32 px</span><div class="bar" style="width:32px"></div></div>
  <div class="row2"><span class="name">--s-12</span><span class="px">48 px</span><div class="bar" style="width:48px"></div></div>
</div>
</body></html>
