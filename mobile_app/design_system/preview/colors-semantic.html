<!doctype html>
<html data-theme="light"><head><meta charset="utf-8"><title>Semantic colors</title>
<link rel="stylesheet" href="_card.css">
</head><body>
<div class="col">
  <div class="label">Semantic — Light / Dark / Grey</div>
  <div class="row">
    <div class="swatch" style="background:#22C55E;color:#fff"><span class="name">Success · Light</span><span class="hex">#22C55E</span></div>
    <div class="swatch" style="background:#34D399;color:#0F1115"><span class="name">Success · Dark</span><span class="hex">#34D399</span></div>
    <div class="swatch" style="background:#4F7A5E;color:#fff"><span class="name">Success · Grey</span><span class="hex">#4F7A5E</span></div>
  </div>
  <div class="row">
    <div class="swatch" style="background:#F59E0B;color:#111"><span class="name">Warning · Light</span><span class="hex">#F59E0B</span></div>
    <div class="swatch" style="background:#FBBF24;color:#111"><span class="name">Warning · Dark</span><span class="hex">#FBBF24</span></div>
    <div class="swatch" style="background:#8E7635;color:#fff"><span class="name">Warning · Grey</span><span class="hex">#8E7635</span></div>
  </div>
  <div class="row">
    <div class="swatch" style="background:#EF4444;color:#fff"><span class="name">Error · Light</span><span class="hex">#EF4444</span></div>
    <div class="swatch" style="background:#F87171;color:#0F1115"><span class="name">Error · Dark</span><span class="hex">#F87171</span></div>
    <div class="swatch" style="background:#9C5A5A;color:#fff"><span class="name">Error · Grey</span><span class="hex">#9C5A5A</span></div>
  </div>
</div>
</body></html>
