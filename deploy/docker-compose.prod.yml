services:
  nginx:
    image: nginx:1.27-alpine
    container_name: sb-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      cloud-api:
        condition: service_healthy

  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: sb-mosquitto
    restart: unless-stopped
    ports:
      - "8883:8883"
    volumes:
      - ../mqtt/config/mosquitto.prod.conf:/mosquitto/config/mosquitto.conf:ro
      - ../mqtt/config/acl.prod.conf:/mosquitto/config/acl.prod.conf:ro
      - ${MQTT_CERT_DIR:-../mqtt/certs}:/mosquitto/certs:ro
      - ./mosquitto/passwords:/mosquitto/passwords
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    environment:
      MQTT_MONITOR_PASSWORD: ${MQTT_MONITOR_PASSWORD:-monitor123}
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -p 8883 --cafile /mosquitto/certs/ca.crt --cert /mosquitto/certs/clients/monitor.crt --key /mosquitto/certs/clients/monitor.key -u monitor -P $$MQTT_MONITOR_PASSWORD -t '$$SYS/broker/uptime' -C 1 -W 3"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  postgres:
    image: postgres:16-alpine
    container_name: sb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sb_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sb_pass}
      POSTGRES_DB: ${POSTGRES_DB:-sb_cloud}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sb_user} -d ${POSTGRES_DB:-sb_cloud}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  cloud-api:
    build:
      context: ./cloud
      dockerfile: Dockerfile
    container_name: sb-cloud-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./cloud/.env
    volumes:
      - ${MQTT_CERT_DIR:-../mqtt/certs}:/mosquitto/certs:ro
    depends_on:
      mosquitto:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  mosquitto-data:
  mosquitto-log:
  postgres-data:
