services:
  nginx:
    image: nginx:1.27-alpine
    container_name: sb-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ${NGINX_CERT_DIR:-./nginx/certs}:/etc/nginx/certs:ro
    depends_on:
      cloud-api:
        condition: service_healthy
    networks:
      - public
      - backend

  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: sb-mosquitto
    restart: unless-stopped
    expose:
      - "8883"
    volumes:
      - ../mqtt/config/mosquitto.prod.conf:/mosquitto/config/mosquitto.conf:ro
      - ../mqtt/config/acl.prod.conf:/mosquitto/config/acl.prod.conf:ro
      - ${MQTT_CERT_DIR:-../mqtt/certs}:/mosquitto/certs:ro
      - ../mqtt/passwords:/mosquitto/passwords
      - mosquitto-data:/mosquitto/data
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -p 8883 --cafile /mosquitto/certs/ca.crt --cert /mosquitto/certs/clients/monitor.crt --key /mosquitto/certs/clients/monitor.key -u monitor -P $$MQTT_MONITOR_PASSWORD -t '$$SYS/broker/uptime' -C 1 -W 3"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    environment:
      MQTT_MONITOR_PASSWORD: ${MQTT_MONITOR_PASSWORD}
    networks:
      - backend

  postgres:
    image: postgres:16-alpine
    container_name: sb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - backend

  cloud-api:
    build:
      context: ../cloud
      dockerfile: Dockerfile
    container_name: sb-cloud-api
    restart: unless-stopped
    expose:
      - "8000"
    env_file:
      - ./.env.prod
    depends_on:
      mosquitto:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - backend

networks:
  public:
  backend:
    internal: true

volumes:
  mosquitto-data:
  postgres-data:
